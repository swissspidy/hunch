name: Bug report
description: A build that fails or writes the wrong output, or a ranking or component that misbehaves.
labels: ['bug']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The command or code, and the catalog (or a small part of it) if you can share it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hunch version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version and OS, or browser
      placeholder: Node.js 24.11, Ubuntu 24.04 / Chrome 142 on Android
    validations:
      required: true
