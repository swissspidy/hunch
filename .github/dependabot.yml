# Dependency updates, weekly, grouped, after a week's cooldown: npm for the package, Composer
# for the WordPress plugin's development tools, and the GitHub Actions the workflows and the
# local action use.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # oxlint's type-aware rules come from oxlint-tsgolint: update them together.
      oxc:
        patterns: ['oxlint', 'oxlint-tsgolint', 'oxfmt']
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Pinned to the version whose Chromium build the CI cache holds; update it deliberately,
      # with the browser.
      - dependency-name: playwright-core
        update-types: [version-update:semver-minor]

  # TypeDoc for the API reference. TypeScript stays on 6: TypeDoc needs its compiler API,
  # which TypeScript 7 doesn't have.
  - package-ecosystem: npm
    directory: /docs/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      api-docs:
        patterns: ['*']
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # The WordPress plugin's tests and coding standards (PHPUnit, PHPCS). The plugin itself has
  # no Composer dependencies.
  - package-ecosystem: composer
    directory: /wordpress/hunch
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      wordpress:
        patterns: ['*']

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
