name: Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'demo/**'
      - 'site/**'
      - 'src/**'
      - 'scripts/demo.ts'
      - 'scripts/site.ts'
      - 'scripts/playground.ts'
      - 'scripts/wordpress.ts'
      - 'wordpress/**'
      - 'scripts/bundle.ts'
      - 'docs/api/**'
      - 'tsconfig.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a pull request's run only cancels that pull request's older runs.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site, the demo and the API reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/api/package-lock.json
      - run: npm ci
      # TypeDoc and the TypeScript 6 it needs, apart from the package's TypeScript 7.
      - run: npm ci --prefix docs/api --ignore-scripts
      # The front page at /, the demo at /demo/ and the WordPress plugin with its Playground demo
      # at /wordpress/, into site/dist. The demos' vectors come from the committed embedding
      # cache: this fails rather than downloading the model if the feed changed without the
      # cache (run `npm run demo` locally and commit demo/hunch-cache).
      - run: node scripts/site.ts --url "$SITE_URL"
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # Into site/dist/api: fails on an undocumented export or a broken link. Its links to the
      # front page and the demo follow the site's base path.
      - run: npm run api
        env:
          HUNCH_SITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only the deploy job publishes; the build runs npm and the repository's code.
    permissions:
      pages: write # publish the site
      id-token: write # deploy-pages proves the deployment's origin with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
